[package]
name = "orbbec-v1-sys"
description = "Raw C bindings for pinned Orbbec SDK v1.10.37 on Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
links = "OrbbecSDK"
readme = "README.md"
keywords = ["orbbec", "camera", "depth", "ffi"]
categories = ["external-ffi-bindings", "hardware-support"]
include = ["src/**", "bindings/**", "build.rs", "wrapper.h", "README.md", "LICENSE"]

[target.x86_64-unknown-linux-gnu.dependencies]
orbbec-v1-bin-x86_64 = { path = "../orbbec-v1-bin-x86_64", version = "=1.10.37" }

[target.aarch64-unknown-linux-gnu.dependencies]
orbbec-v1-bin-aarch64 = { path = "../orbbec-v1-bin-aarch64", version = "=1.10.37" }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
