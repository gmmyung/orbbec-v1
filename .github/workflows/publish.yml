name: Publish orbbec-v1

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected orbbec-v1 version from Cargo.toml
        required: true
        type: string
        default: '0.1.0'
      publish:
        description: Upload packages to crates.io (otherwise verify only)
        required: true
        type: boolean
        default: false
      authentication:
        description: Use token for initial publication, trusted for later releases
        required: true
        type: choice
        options:
          - trusted
          - token
        default: trusted

permissions:
  contents: read

concurrency:
  group: orbbec-v1-crates-io
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require the default branch
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$CURRENT_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check repository files and history for crates.io tokens
        run: python3 scripts/check-secrets.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev gcc-aarch64-linux-gnu
      - name: Install the tested Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target aarch64-unknown-linux-gnu
          rustup default 1.99.1
      - name: Test and lint
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 -m unittest discover -s tests -p 'test_publish*.py'
      - name: Verify package contents and isolated consumer
        run: python3 scripts/check-distribution.py
      - name: Build the ARM64 viewer
        run: scripts/build-arm64.sh --viewer --locked
      - name: Prepare the release plan without publishing
        run: python3 scripts/publish-crates.py --version "$RELEASE_VERSION" --prepared
      - name: Save packages and verification reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: orbbec-v1-${{ inputs.version }}-${{ github.sha }}
          path: |
            target/package/*.crate
            target/distribution-check/report.json
            target/release-plan.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Install the tested Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Authenticate with trusted publishing
        if: ${{ inputs.authentication == 'trusted' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish using trusted publishing
        if: ${{ inputs.authentication == 'trusted' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish-crates.py --version "$RELEASE_VERSION" --execute
      - name: Publish using the initial-publication secret
        if: ${{ inputs.authentication == 'token' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish-crates.py --version "$RELEASE_VERSION" --execute
